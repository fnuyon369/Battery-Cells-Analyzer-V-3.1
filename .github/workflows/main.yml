name: Build exe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install matplotlib numpy pyinstaller
      - run: pyinstaller --noconsole --onefile --name BatteryCellsAnalyzerV3 --icon icon.ico --add-data "icon.ico;." app.py
      - uses: actions/upload-artifact@v4
        with:
          name: BatteryCellsAnalyzerV3-windows
          path: dist/BatteryCellsAnalyzerV3.exe
